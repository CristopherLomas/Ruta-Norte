# ===================================================================
# CONFIGURACIÓN DE SPRING BOOT - RUTA NORTE (UPEC)
# ===================================================================
spring.application.name=rutanorte-backend
server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# CONEXIÓN A BASE DE DATOS POSTGRESQL (Supabase Cloud o Local)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.npgxydljljhatmjaaxnj
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# JPA & HIBERNATE
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# SEGURIDAD & JWT
# -------------------------------------------------------------------
# Clave HMAC-SHA256 mínima de 256 bits (32+ caracteres)
jwt.secret=RutaNorteClaveSecretaSuperSeguraParaJWTEcuador2026UPECCarchiImbaburaTransporte!
jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# SWAGGER / OPENAPI 3
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# -------------------------------------------------------------------
# CORS
# -------------------------------------------------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ruta-norte.vercel.app
